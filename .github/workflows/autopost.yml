name: Postador Facebook

on:
  schedule:
    # Cron ESPARSO e concentrado na janela de publicacao, em vez de */20.
    # Motivo: com */20 (72 execucoes/dia) o GitHub estrangulou a fila deste
    # repo - caiu de ~35 runs/dia (22-26/08) para 2-6/dia (27-31/08), com
    # buracos de 5 a 11 horas, e nenhum run caiu na janela de postagem depois
    # de 26/08. O robo ficou 6 dias sem postar sem nenhum erro no log.
    #
    # Os horarios abaixo sao UTC e cercam o unico slot do dia (09:00 New York
    # = 13:00 UTC no horario de verao, 14:00 UTC no de inverno). Junto com
    # now_tolerance_minutes: 300, qualquer um deles que rode publica o post do
    # dia; state.slot_taken garante que so o primeiro publica.
    - cron: "5,35 13 * * *"
    - cron: "5,35 14 * * *"
    - cron: "5,35 15 * * *"
    - cron: "5,35 16 * * *"
    - cron: "5,35 17 * * *"
    - cron: "5,35 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular sem publicar"
        type: boolean
        default: false
      teste_um_video:
        description: "Publicar UM video agora (teste de ponta a ponta)"
        type: boolean
        default: false
      teste_escolha:
        description: "Qual video usar no teste"
        type: choice
        options: [menor, maior, fila]
        default: menor
      teste_nome:
        description: "Teste: trecho do nome do video (opcional)"
        type: string
        default: ""
      limpar_agendados:
        description: "Apagar os posts agendados e devolver os videos a fila"
        type: boolean
        default: false
      diagnosticar:
        description: "So diagnosticar: comparar privacidade dos posts"
        type: boolean
        default: false

# Nunca dois runs ao mesmo tempo: evita post duplicado e conflito no state.
concurrency:
  group: autopost
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Garantir ffmpeg
        run: ffprobe -version >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Instalar rclone
        run: |
          if ! command -v rclone >/dev/null 2>&1; then
            curl -fsSL https://rclone.org/install.sh | sudo bash \
              || (sudo apt-get update -qq && sudo apt-get install -y -qq rclone)
          fi
          rclone version | head -1

      - name: Instalar dependencias
        run: pip install -q -r requirements.txt

      # Os inputs entram SO por variavel de ambiente. Interpolar ${{ inputs.x }}
      # dentro do 'run' permitiria injecao de comando pelo campo de texto.
      - name: Publicar
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          TESTE_ESCOLHA: ${{ inputs.teste_escolha }}
          TESTE_NOME: ${{ inputs.teste_nome }}
          TESTE_UM_VIDEO: ${{ inputs.teste_um_video }}
          LIMPAR_AGENDADOS: ${{ inputs.limpar_agendados }}
          DIAGNOSTICAR: ${{ inputs.diagnosticar }}
        run: |
          if [ "$DIAGNOSTICAR" = "true" ]; then
            python -m tools.diagnosticar
          elif [ "$LIMPAR_AGENDADOS" = "true" ]; then
            python -m tools.limpar_agendados --apagar
          elif [ "$TESTE_UM_VIDEO" = "true" ]; then
            python -m tools.testar_post
          else
            python -m src.main
          fi

      # Sem rebase: dois runs simultaneos conflitam no mesmo JSON e o rebase
      # trava, derrubando as tentativas seguintes. Aqui a cada tentativa
      # pegamos a versao mais nova do repositorio e fundimos o nosso registro
      # nela - a uniao nunca perde um post ja publicado.
      # O robo grava avisos de estoque em avisos.txt. Viram uma issue e o
      # GitHub manda o e-mail. Falta de video nao falha o workflow: isso
      # encheria a caixa de entrada a cada 20 minutos.
      - name: Avisar se o estoque acabou
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TITULO: Estoque de videos precisa de atencao
        run: |
          [ -s avisos.txt ] || exit 0

          ABERTAS=$(gh issue list --state open --search "$TITULO in:title" --json number --jq 'length')
          if [ "$ABERTAS" != "0" ]; then
            echo "ja existe issue aberta sobre estoque - nao duplico"
            exit 0
          fi

          {
            echo "O robo encontrou isto em $(date -u '+%d/%m %H:%M') UTC:"
            echo
            sed 's/^/- /' avisos.txt
            echo
            echo 'Reponha a pasta, ou acrescente outra na lista source da etiqueta.'
            echo 'Feche esta issue depois de resolver: so entao um novo aviso e criado.'
          } > corpo-issue.md

          gh issue create --title "$TITULO" --body-file corpo-issue.md
      - name: Salvar o que foi postado
        if: always()
        env:
          LIMPAR_AGENDADOS: ${{ inputs.limpar_agendados }}
        run: |
          git config user.name  "autoposter"
          git config user.email "autoposter@users.noreply.github.com"
          cp state/posted.json /tmp/estado-desta-execucao.json

          for tentativa in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"

            if [ "$LIMPAR_AGENDADOS" = "true" ]; then
              # Remocao e intencional: fundir por uniao traria de volta
              # exatamente os agendamentos que acabamos de apagar.
              cp /tmp/estado-desta-execucao.json state/posted.json
              echo "estado substituido (limpeza)"
            else
              python -m tools.mesclar_estado /tmp/estado-desta-execucao.json
            fi

            git add state/posted.json
            if git diff --cached --quiet; then
              echo "nada novo para registrar"
              exit 0
            fi

            git commit -q -m "state: posts de $(date -u +%Y-%m-%d)"
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "estado salvo"
              exit 0
            fi
            echo "outro run gravou primeiro; refazendo com a versao dele (tentativa $tentativa)"
            sleep $((tentativa * 3))
          done

          echo "::error::nao consegui salvar o estado - risco de repostar video"
          exit 1
