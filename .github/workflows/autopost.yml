name: Postador Facebook

on:
  schedule:
    # 06:00 UTC = 03:00 em Brasilia. O robo sobe os videos do dia de madrugada
    # e o proprio Facebook publica nos horarios exatos do config.yaml.
    - cron: "0 6 * * *"
    # Rede de seguranca: se o run da madrugada falhar, este pega o que ficou.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular sem publicar"
        type: boolean
        default: false
      teste_um_video:
        description: "Publicar UM video agora (teste de ponta a ponta)"
        type: boolean
        default: false
      teste_escolha:
        description: "Qual video usar no teste"
        type: choice
        options: [menor, maior, fila]
        default: menor
      teste_nome:
        description: "Teste: trecho do nome do video (opcional)"
        type: string
        default: ""

# Nunca dois runs ao mesmo tempo: evita post duplicado e conflito no state.
concurrency:
  group: autopost
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Garantir ffmpeg
        run: ffprobe -version >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Instalar rclone
        run: |
          if ! command -v rclone >/dev/null 2>&1; then
            curl -fsSL https://rclone.org/install.sh | sudo bash \
              || (sudo apt-get update -qq && sudo apt-get install -y -qq rclone)
          fi
          rclone version | head -1

      - name: Instalar dependencias
        run: pip install -q -r requirements.txt

      # Os inputs entram SO por variavel de ambiente. Interpolar ${{ inputs.x }}
      # dentro do 'run' permitiria injecao de comando pelo campo de texto.
      - name: Publicar
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          TESTE_ESCOLHA: ${{ inputs.teste_escolha }}
          TESTE_NOME: ${{ inputs.teste_nome }}
          TESTE_UM_VIDEO: ${{ inputs.teste_um_video }}
        run: |
          if [ "$TESTE_UM_VIDEO" = "true" ]; then
            python -m tools.testar_post
          else
            python -m src.main
          fi

      # Sem rebase: dois runs simultaneos conflitam no mesmo JSON e o rebase
      # trava, derrubando as tentativas seguintes. Aqui a cada tentativa
      # pegamos a versao mais nova do repositorio e fundimos o nosso registro
      # nela - a uniao nunca perde um post ja publicado.
      - name: Salvar o que foi postado
        if: always()
        run: |
          git config user.name  "autoposter"
          git config user.email "autoposter@users.noreply.github.com"
          cp state/posted.json /tmp/estado-desta-execucao.json

          for tentativa in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            python -m tools.mesclar_estado /tmp/estado-desta-execucao.json

            git add state/posted.json
            if git diff --cached --quiet; then
              echo "nada novo para registrar"
              exit 0
            fi

            git commit -q -m "state: posts de $(date -u +%Y-%m-%d)"
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "estado salvo"
              exit 0
            fi
            echo "outro run gravou primeiro; refazendo com a versao dele (tentativa $tentativa)"
            sleep $((tentativa * 3))
          done

          echo "::error::nao consegui salvar o estado - risco de repostar video"
          exit 1
