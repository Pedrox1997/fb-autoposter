# ============================================================
#  POSTADOR AUTOMATICO - CONFIG
#  Este arquivo tambem e escrito pelo painel (python -m tools.painel).
#  Nenhum token aqui: segredos ficam em GitHub Secrets.
# ============================================================

timezone: America/Sao_Paulo

# Tokens de USUARIO de longa duracao: com eles o robo descobre sozinho o token
# de cada Pagina. Sem esta chave, usa toda variavel FB_USER_TOKEN,
# FB_USER_TOKEN_2, FB_USER_TOKEN_3... que existir - um perfil por token.
# facebook_user_token_env: [FB_USER_TOKEN, FB_USER_TOKEN_2]

# now = publica na hora em que o robo acorda.
# Nao use 'schedule': Reels agendado pela API nao entra na esteira de Reels -
# o post fica publico mas nao aparece na aba nem recebe recomendacao. Medido
# em 08/08/2026: os publicados na hora aparecem, os agendados nao.
mode: now
schedule_horizon_hours: 30      # so vale para mode: schedule
now_tolerance_minutes: 45       # janela para publicar um horario ja vencido
# true = quando a pasta acaba, recomeca do primeiro video (e abre uma issue
# avisando, para voce repor). false = para a pagina e avisa.
recycle_when_empty: true
validate_media: true            # pula video fora do padrao do formato

defaults:
  order: name                   # name | created | random_stable
  # reel = tenta publicar como Reels (esteira de recomendacao, alcanca quem
  # nao segue a pagina). Se o Facebook recusar o arquivo, o robo publica como
  # video de feed sozinho, sem perder o horario.
  post_type: reel               # reel | video | auto

# ------------------------------------------------------------
#  ETIQUETAS
#  Cada etiqueta junta as paginas de um idioma e aponta uma pasta.
#  As paginas da etiqueta DIVIDEM os videos: no mesmo horario cada uma leva
#  um arquivo diferente, e um video nunca se repete na mesma pagina - ele
#  apenas circula entre as paginas irmas.
# ------------------------------------------------------------
grupos:
  - nome: "Ingles"
    # source aceita uma lista: quando a primeira pasta esgota, o robo passa
    # para a seguinte sozinho. Acrescente pastas aqui para nao repetir video.
    source:
      - "onedrive:PAGINAS FACEBOOK ( arquivo videos 00)/BAIXADOS DAS PAGINAS/REDE 1- IRÔNICA/R1 - Inglês"
    timezone: America/New_York
    post_type: reel
    times:
      - "09:00"     # 1 post por dia: estica o estoque e evita repetir rapido
    paginas:
      - name: "Daily Blessings"
        page_id: "102725309222801"
        token_env: PAGE1_TOKEN     # enquanto o FB_USER_TOKEN nao esta cadastrado

  # ---- modelo para as proximas etiquetas ----
  # - nome: "Portugues"
  #   source: "onedrive:.../REDE 1- IRÔNICA/BRASIL"
  #   timezone: America/Sao_Paulo
  #   times: ["08:00", "12:30", "20:00"]
