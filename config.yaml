# ============================================================
#  POSTADOR AUTOMATICO - CONFIG
#  Este arquivo tambem e escrito pelo painel (python -m tools.painel).
#  Nenhum token aqui: segredos ficam em GitHub Secrets.
# ============================================================

timezone: America/Sao_Paulo

# Tokens de USUARIO de longa duracao: com eles o robo descobre sozinho o token
# de cada Pagina. Sem esta chave, usa toda variavel FB_USER_TOKEN,
# FB_USER_TOKEN_2, FB_USER_TOKEN_3... que existir - um perfil por token.
# facebook_user_token_env: [FB_USER_TOKEN, FB_USER_TOKEN_2]

mode: schedule                  # schedule = o Facebook publica na hora exata
schedule_horizon_hours: 30      # quanto tempo para frente o robo agenda
now_tolerance_minutes: 45       # tolerancia do mode: now, se o cron atrasar
recycle_when_empty: false       # true = recomeca a pasta quando acabar
validate_media: true            # pula video fora do padrao do formato

defaults:
  order: name                   # name | created | random_stable
  post_type: video              # video (qualquer duracao) | reel (ate 90s)

# ------------------------------------------------------------
#  ETIQUETAS
#  Cada etiqueta junta as paginas de um idioma e aponta uma pasta.
#  As paginas da etiqueta DIVIDEM os videos: no mesmo horario cada uma leva
#  um arquivo diferente, e um video nunca se repete na mesma pagina - ele
#  apenas circula entre as paginas irmas.
# ------------------------------------------------------------
grupos:
  - nome: "Ingles"
    source: "onedrive:PAGINAS FACEBOOK ( arquivo videos 00)/BAIXADOS DAS PAGINAS/REDE 1- IRÔNICA/R1 - Inglês"
    timezone: America/New_York
    post_type: video
    times:
      - "09:00"
      - "13:00"
      - "19:30"
    paginas:
      - name: "Daily Blessings"
        page_id: "102725309222801"
        token_env: PAGE1_TOKEN     # enquanto o FB_USER_TOKEN nao esta cadastrado

  # ---- modelo para as proximas etiquetas ----
