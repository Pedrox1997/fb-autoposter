# ============================================================
#  POSTADOR AUTOMATICO - CONFIG
#  Nenhum token aqui. Segredos ficam em GitHub Secrets.
# ============================================================

# Fuso padrao, usado por paginas que nao definirem o proprio.
timezone: America/Sao_Paulo

# Secret com o token de USUARIO de longa duracao. Com ele o robo descobre
# sozinho o token de cada Pagina - assim voce nao cadastra um secret por pagina.
facebook_user_token_env: FB_USER_TOKEN

# schedule = sobe o video e o FACEBOOK publica na hora exata (recomendado)
# now      = publica no momento em que o workflow rodar
mode: schedule

schedule_horizon_hours: 30      # quanto tempo para frente o robo agenda
now_tolerance_minutes: 45       # tolerancia do mode: now, se o cron atrasar
recycle_when_empty: false       # true = recomeca a pasta quando acabar
validate_media: true            # pula video fora do padrao de Reels

# ------------------------------------------------------------
# Valores herdados por todas as paginas. Cada pagina pode sobrescrever.
# ------------------------------------------------------------
defaults:
  # Os videos das pastas sao verticais porem longos (2 a 6 min), acima do
  # limite de 90s do Reels - por isso vao como video de feed.
  post_type: video              # reel | video
  order: name                   # name | created | random_stable
  times:
    - "09:00"
    - "13:00"
    - "19:30"

# ------------------------------------------------------------
# Uma entrada por Pagina. page_id e source NAO sao segredos - podem ficar
# aqui mesmo. So o token e sigiloso, e ele vem do FB_USER_TOKEN.
# ------------------------------------------------------------
pages:
  - name: "Daily Blessings"
    page_id: "102725309222801"
    token_env: PAGE1_TOKEN       # enquanto o FB_USER_TOKEN nao esta cadastrado
    timezone: America/New_York
    source: "onedrive:PAGINAS FACEBOOK ( arquivo videos 00)/BAIXADOS DAS PAGINAS/REDE 1- IRÔNICA/R1 - Inglês"
    default_caption: "Watch till the end"
    hashtags: ""

