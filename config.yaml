  #   paginas:
  #     - {name: "Pagina BR 1", page_id: "111"}
  #     - {name: "Pagina BR 2", page_id: "222"}

# Fusos uteis: America/Sao_Paulo (BR), America/New_York (EUA leste),
# America/Los_Angeles (EUA oeste), America/Mexico_City (MX),
# Europe/Madrid (ES), Europe/Paris (FR), Europe/Rome (IT), Europe/Berlin (DE)
